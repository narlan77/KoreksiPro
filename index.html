<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreksi Pro v3.1 - Antrean Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .input-opt { @apply border rounded text-center font-bold uppercase focus:ring-2 focus:ring-blue-400 outline-none transition-all; }
            /* Ukuran dinamis: soal biasa kotak, soal 31-40 lebih lebar untuk 5 karakter */
            .kunci-reguler { @apply w-10 h-10 border border-dashed border-blue-400 bg-blue-50 text-center font-bold uppercase rounded outline-none cursor-pointer focus:ring-2 focus:ring-green-400 transition-all; }
            .kunci-multi { @apply w-24 h-10 border border-dashed border-amber-400 bg-amber-50 text-center font-bold uppercase rounded outline-none cursor-pointer focus:ring-2 focus:ring-amber-400 transition-all; }
            .bobot-in { @apply w-12 text-center font-bold text-gray-400 bg-transparent border-b border-transparent focus:border-blue-200 outline-none; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight"><i class="fa fa-check-square-o mr-2"></i>KOREKSI PRO <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-1 uppercase">v3.1</span></h1>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p class="text-[10px] text-gray-400 uppercase font-bold">Total Skor Maks</p>
                    <p id="totalMaks" class="text-xl font-black text-blue-600">0</p>
                </div>
                <button onclick="hapusSemuaData()" class="bg-red-50 text-red-600 border border-red-100 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-100">HAPUS DB</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h2 class="font-bold text-lg text-gray-700">Pengaturan Kunci Jawaban</h2>
                    <p class="text-xs text-gray-500">No 1-30 (1 Karakter), No 31-40 (Maks 5 Karakter - Benar Sebagian)</p>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-xs text-gray-400 uppercase text-left border-b">
                            <th class="pb-3 w-16">No</th>
                            <th class="pb-3 text-center">Kunci Jawaban</th>
                            <th class="pb-3 text-center w-32">Bobot</th>
                            <th class="pb-3 text-right">Tipe Penilaian</th>
                        </tr>
                    </thead>
                    <tbody id="tabelKunci"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // State data 40 soal
        let dataKunci = Array.from({ length: 40 }, (_, i) => ({
            no: i + 1,
            kunci: i < 30 ? 'A' : 'ABCDE', // Default 5 karakter untuk 31-40
            bobot: 1
        }));

        function renderTabelKunci() {
            const container = document.getElementById('tabelKunci');
            container.innerHTML = dataKunci.map((item, index) => {
                const isMulti = item.no > 30;
                return `
                <tr class="border-b border-gray-50 last:border-0 hover:bg-gray-50/50">
                    <td class="py-3 font-bold text-gray-400">#${item.no}</td>
                    <td class="py-3 text-center">
                        <input type="text" 
                               maxlength="${isMulti ? 5 : 1}" 
                               class="${isMulti ? 'kunci-multi' : 'kunci-reguler'}" 
                               value="${item.kunci}" 
                               oninput="this.value = this.value.toUpperCase()"
                               onchange="updateKunci(this, ${index})">
                    </td>
                    <td class="py-3 text-center">
                        <input type="number" step="0.1" class="bobot-in" 
                               value="${item.bobot}" 
                               onchange="updateBobot(${index}, this.value)">
                    </td>
                    <td class="py-3 text-right">
                        <span class="text-[10px] font-bold px-2 py-1 rounded ${isMulti ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600'}">
                            ${isMulti ? 'PARTIAL SCORE' : 'SINGLE MATCH'}
                        </span>
                    </td>
                </tr>`;
            }).join('');
            updateTotalMaks();
        }

        function updateKunci(el, index) {
            dataKunci[index].kunci = el.value.toUpperCase();
            console.log(`Kunci ${index+1} diperbarui: ${dataKunci[index].kunci}`);
        }

        function updateBobot(index, val) {
            dataKunci[index].bobot = parseFloat(val) || 0;
            updateTotalMaks();
        }

        function updateTotalMaks() {
            const total = dataKunci.reduce((acc, curr) => acc + curr.bobot, 0);
            document.getElementById('totalMaks').innerText = total.toFixed(1);
        }

        /**
         * LOGIKA PENILAIAN BARU:
         * 1-30: Harus sama persis (1 karakter).
         * 31-40: Benar sebagian per karakter sesuai urutan (Maks 5 karakter).
         */
        function hitungSkorSiswa(jawabanSiswa) {
            let totalSkor = 0;

            dataKunci.forEach((kunciItem, i) => {
                const jawab = jawabanSiswa[i] || "";
                const kunci = kunciItem.kunci || "";

                if (kunciItem.no <= 30) {
                    // Logika Pilihan Ganda Biasa
                    if (jawab === kunci) totalSkor += kunciItem.bobot;
                } else {
                    // Logika 31-40: Benar Sebagian (Urutan Karakter)
                    // Bobot dibagi rata per karakter kunci (maks 5)
                    const charKunci = kunci.split('');
                    const charJawab = jawab.split('');
                    const bobotPerKarakter = kunciItem.bobot / 5;

                    charKunci.forEach((char, idx) => {
                        if (charJawab[idx] === char) {
                            totalSkor += bobotPerKarakter;
                        }
                    });
                }
            });

            return totalSkor;
        }

        function hapusSemuaData() {
            if(confirm('Reset semua kunci?')) {
                dataKunci.forEach((d, i) => d.kunci = i < 30 ? 'A' : 'ABCDE');
                renderTabelKunci();
            }
        }

        renderTabelKunci();
    </script>
</body>
</html>
