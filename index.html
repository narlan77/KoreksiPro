<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreksi Pro v3.1 - Antrean Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer utilities {
            .input-opt { @apply w-10 h-10 border rounded text-center font-bold uppercase focus:ring-2 focus:ring-blue-400 outline-none transition-all; }
            .kunci-opt { @apply w-10 h-10 border border-dashed border-blue-400 bg-blue-50 text-center font-bold uppercase rounded outline-none cursor-pointer focus:ring-2 focus:ring-green-400 focus:border-green-400 focus:bg-green-50 transition-all; }
            .bobot-in { @apply w-12 text-center font-bold text-gray-400 bg-transparent border-b border-transparent focus:border-blue-200 outline-none; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight"><i class="fa fa-check-square-o mr-2"></i>KOREKSI PRO <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-1">v3.1</span></h1>
            <div class="text-sm font-bold text-gray-500 bg-white px-4 py-2 rounded-lg border shadow-sm">
                Total Skor Maksimal: <span id="totalMaks" class="text-blue-600">40</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <h2 class="font-bold text-lg text-gray-700 mb-4">Pengaturan Kunci Jawaban</h2>
                <div class="overflow-y-auto max-h-[500px] pr-2" id="scrollKunci">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="text-xs text-gray-400 uppercase text-left border-b">
                                <th class="pb-2">No</th>
                                <th class="pb-2 text-center">Kunci</th>
                                <th class="pb-2 text-center">Bobot</th>
                                <th class="pb-2">Tipe</th>
                            </tr>
                        </thead>
                        <tbody id="tabelKunci"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border">
                <h2 class="font-bold text-lg text-gray-700 mb-4">Simulasi Koreksi</h2>
                <div class="p-4 bg-blue-50 rounded-xl mb-4 border border-blue-100">
                    <p class="text-xs text-blue-700 leading-relaxed">
                        <strong>Aturan Khusus (31-40):</strong> Benar sebagian diperbolehkan. Skor diberikan per butir soal jika huruf sesuai dengan urutan pada kunci.
                    </p>
                </div>
                <div id="panelSiswa">
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-dashed">
                        <span class="font-bold text-gray-600">Hasil Skor:</span>
                        <span id="skorAkhir" class="text-3xl font-black text-green-600">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi 40 Soal
        let dataKunci = Array.from({ length: 40 }, (_, i) => ({
            no: i + 1,
            kunci: 'A',
            bobot: 1
        }));

        function renderTabelKunci() {
            const container = document.getElementById('tabelKunci');
            container.innerHTML = dataKunci.map((item, index) => `
                <tr class="border-b border-gray-50 last:border-0">
                    <td class="py-2 text-sm font-medium text-gray-400">${item.no}</td>
                    <td class="py-2 text-center">
                        <input type="text" maxlength="1" class="kunci-opt" 
                               value="${item.kunci}" 
                               oninput="this.value = this.value.toUpperCase()"
                               onchange="updateKunci(this, ${index})">
                    </td>
                    <td class="py-2 text-center">
                        <input type="number" class="bobot-in" 
                               value="${item.bobot}" 
                               onchange="updateBobot(${index}, this.value)">
                    </td>
                    <td class="py-2 text-[10px] font-bold ${item.no > 30 ? 'text-amber-500' : 'text-blue-400'}">
                        ${item.no > 30 ? 'URUTAN' : 'REGULER'}
                    </td>
                </tr>
            `).join('');
            updateTotalMaks();
        }

        function updateKunci(el, index) {
            const val = el.value.toUpperCase();
            if (/^[A-E]$/.test(val)) {
                dataKunci[index].kunci = val;
                hitungSkor(); // Re-kalkulasi tiap ada perubahan
            } else {
                el.value = dataKunci[index].kunci;
            }
        }

        function updateBobot(index, val) {
            dataKunci[index].bobot = parseFloat(val) || 0;
            updateTotalMaks();
            hitungSkor();
        }

        function updateTotalMaks() {
            const total = dataKunci.reduce((acc, curr) => acc + curr.bobot, 0);
            document.getElementById('totalMaks').innerText = total;
        }

        // LOGIKA UTAMA: Hitung Skor dengan "Benar Sebagian" untuk 31-40
        function hitungSkor() {
            // Simulasi: Kita asumsikan jawaban siswa sama dengan kunci untuk demo
            // Di aplikasi nyata, 'jawabanSiswa' diambil dari input/database
            let jawabanSiswa = dataKunci.map(d => d.kunci); 
            
            let skorTotal = 0;

            // Loop 40 Soal
            for (let i = 0; i < 40; i++) {
                // Baik nomor 1-30 maupun 31-40, dicek per butir
                // Untuk 31-40, "benar sebagian" berarti jika urutan ke-i benar, bobot i ditambahkan
                if (jawabanSiswa[i] === dataKunci[i].kunci) {
                    skorTotal += dataKunci[i].bobot;
                }
            }

            document.getElementById('skorAkhir').innerText = skorTotal;
        }

        // Jalankan saat load
        renderTabelKunci();
        hitungSkor();
    </script>
</body>
</html>
