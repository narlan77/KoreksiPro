<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreksi Pro v3.1 - Antrean Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-opt { @apply w-10 h-10 border rounded text-center font-bold uppercase focus:ring-2 focus:ring-blue-400 outline-none transition-all; }
            /* Styling untuk kolom kunci agar terlihat sebagai area yang bisa diinput */
            .kunci-opt { @apply w-10 h-10 border border-dashed border-blue-400 bg-blue-50 text-center font-bold uppercase rounded outline-none cursor-pointer focus:ring-2 focus:ring-green-400 focus:border-green-400 focus:bg-green-50 transition-all; }
            .bobot-in { @apply w-12 text-center font-bold text-gray-400 bg-transparent border-b border-transparent focus:border-blue-200 outline-none; }
        }
        #listRekap::-webkit-scrollbar { width: 4px; }
        #listRekap::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight"><i class="fa fa-check-square-o mr-2"></i>KOREKSI PRO <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-1 uppercase">v3.1</span></h1>
            <div class="flex gap-2">
                <button onclick="eksporDatabase()" class="bg-white border shadow-sm px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-50 transition-all"><i class="fa fa-database mr-1 text-blue-500"></i> EKSPOR</button>
                <label class="cursor-pointer bg-white border shadow-sm px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-50 transition-all">
                    <i class="fa fa-folder-open mr-1 text-amber-500"></i> RESTORE
                    <input type="file" class="hidden" accept=".json" onchange="imporDatabase(event)">
                </label>
                <button onclick="hapusSemuaData()" class="bg-red-50 border border-red-100 shadow-sm px-4 py-2 rounded-xl text-xs font-bold text-red-600 hover:bg-red-100 transition-all">
                    <i class="fa fa-trash mr-1"></i> HAPUS DB
                </button>
            </div>
        </div>

        <div class="mb-6">
            <button onclick="window.open('https://github.com/narlan77/KoreksiPro/blob/main/README.md')" 
                    class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 transition-all">
                <i class="fa fa-book mr-1"></i> Baca Panduan (README)
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-lg text-gray-700">Pengaturan Kunci Jawaban</h2>
                <span class="text-xs text-gray-400 italic">*Klik pada kotak kunci untuk mengubah</span>
            </div>
            <div class="overflow-x-auto pb-2">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="text-xs text-gray-400 uppercase">
                            <th class="p-2 text-left">No</th>
                            <th class="p-2 text-center">Kunci</th>
                            <th class="p-2 text-center">Bobot</th>
                        </tr>
                    </thead>
                    <tbody id="tabelKunci">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Data Dummy / Initial State
        let dataKunci = Array.from({ length: 10 }, (_, i) => ({
            no: i + 1,
            kunci: 'A',
            bobot: 1
        }));

        function renderTabelKunci() {
            const container = document.getElementById('tabelKunci');
            container.innerHTML = dataKunci.map((item, index) => `
                <tr class="border-b border-gray-50 last:border-0">
                    <td class="p-2 text-sm font-medium text-gray-500">${item.no}</td>
                    <td class="p-2 text-center">
                        <input type="text" 
                               maxlength="1" 
                               class="kunci-opt" 
                               value="${item.kunci}" 
                               oninput="this.value = this.value.toUpperCase()"
                               onchange="updateKunci(${index}, this.value)">
                    </td>
                    <td class="p-2 text-center">
                        <input type="number" 
                               class="bobot-in" 
                               value="${item.bobot}" 
                               onchange="updateBobot(${index}, this.value)">
                    </td>
                </tr>
            `).join('');
        }

        function updateKunci(index, value) {
            const allowed = ['A', 'B', 'C', 'D', 'E'];
            if (allowed.includes(value.toUpperCase())) {
                dataKunci[index].kunci = value.toUpperCase();
                console.log(`Kunci No ${index + 1} diubah menjadi: ${value}`);
                // Panggil fungsi hitung skor di sini jika ada
            } else {
                alert("Gunakan pilihan A, B, C, D, atau E");
                renderTabelKunci(); // Refresh untuk mengembalikan nilai lama
            }
        }

        function updateBobot(index, value) {
            dataKunci[index].bobot = parseFloat(value) || 0;
            console.log(`Bobot No ${index + 1} diubah menjadi: ${value}`);
        }

        // Inisialisasi awal
        renderTabelKunci();

        // Fungsi Placeholder untuk Database
        function eksporDatabase() { alert('Mengekspor data...'); }
        function imporDatabase(e) { alert('Mengimpor data...'); }
        function hapusSemuaData() { 
            if(confirm('Hapus semua data?')) {
                alert('Data dihapus');
            }
        }
    </script>
</body>
</html>
