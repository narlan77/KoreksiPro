<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreksi Pro v3.1 - Antrean Cerdas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-opt { @apply w-10 h-10 border rounded text-center font-bold uppercase focus:ring-2 focus:ring-blue-400 outline-none transition-all; }
            .kunci-opt { @apply w-10 h-10 border border-dashed border-blue-400 bg-blue-50 text-center font-bold uppercase rounded outline-none; }
            .bobot-in { @apply w-12 text-center font-bold text-gray-400 bg-transparent border-b border-transparent focus:border-blue-200 outline-none; }
        }
        #listRekap::-webkit-scrollbar { width: 4px; }
        #listRekap::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight"><i class="fa fa-check-square-o mr-2"></i>KOREKSI PRO <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-2">v3.1</span></h1>
            <div class="flex gap-2">
                <button onclick="eksporDatabase()" class="bg-white border shadow-sm px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-50 transition-all"><i class="fa fa-database mr-1 text-blue-600"></i> EXPORT DB</button>
                <label class="cursor-pointer bg-white border shadow-sm px-4 py-2 rounded-xl text-xs font-bold hover:bg-gray-50 transition-all">
                    <i class="fa fa-folder-open mr-1 text-amber-500"></i> RESTORE
                    <input type="file" class="hidden" accept=".json" onchange="imporDatabase(event)">
                </label>
                <button onclick="hapusSemuaData()" class="bg-red-50 border border-red-100 shadow-sm px-4 py-2 rounded-xl text-xs font-bold text-red-600 hover:bg-red-100 transition-all">
                    <i class="fa fa-trash mr-1"></i> HAPUS DB
                </button>
            </div>
        </div>
        <!-- Link ke README.md -->
        <div class="mb-6">
            <button onclick="window.open('https://github.com/narlan77/KoreksiPro/blob/main/README.md')" 
        class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-700 transition-all">
    <i class="fa fa-book mr-1"></i> Baca Panduan (README)
</button>
        </div>
<!-- (lanjutan HTML tetap seperti semula, konten berikutnya tidak diubah) -->
